<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fest Service Worker Example</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, #fff6cc 0%, transparent 45%),
          linear-gradient(180deg, #f4efe2 0%, #e8dcc6 100%);
        color: #2b2318;
      }

      main {
        width: min(640px, calc(100vw - 48px));
        padding: 32px;
        border: 1px solid rgba(43, 35, 24, 0.12);
        border-radius: 24px;
        background: rgba(255, 250, 240, 0.88);
        box-shadow: 0 24px 80px rgba(70, 54, 28, 0.12);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 3vw, 2.8rem);
      }

      p {
        margin: 0;
        line-height: 1.6;
      }

      #status {
        color: #755c2b;
      }

      #result {
        margin-top: 20px;
        padding: 20px;
        border-radius: 18px;
        background: #fff;
        min-height: 56px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Fest Service Worker Example</h1>
      <p id="status">Registering service worker...</p>
      <div id="result"></div>
    </main>

    <script type="module">
      const status = document.querySelector("#status");
      const result = document.querySelector("#result");

      async function waitForController() {
        if (navigator.serviceWorker.controller) {
          return;
        }

        await new Promise((resolve) => {
          navigator.serviceWorker.addEventListener("controllerchange", resolve, { once: true });
        });
      }

      async function main() {
        if (!("serviceWorker" in navigator)) {
          status.textContent = "Service workers are not supported in this browser.";
          return;
        }

        const registration = await navigator.serviceWorker.register("./sw.mjs", {
          type: "module",
        });

        status.textContent = `Registered ${registration.scope}`;

        await navigator.serviceWorker.ready;
        await waitForController();

        const response = await fetch("./hello");
        result.innerHTML = await response.text();
        status.textContent = `Service worker ready on ${registration.scope}`;
      }

      main().catch((error) => {
        status.textContent = `Failed to start service worker: ${error}`;
      });
    </script>
  </body>
</html>
